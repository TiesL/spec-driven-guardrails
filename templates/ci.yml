name: CI

# Runs on pull requests and on pushes to main.
#
# `pull_request` judges the merged result — head merged into base — not
# just the branch on its own. That is exactly the case where two
# individually green branches can break together. It is also the form you
# can set as a required check on a pull request, so the form that can
# actually block a merge.
#
# `push: branches: [main]` is the backstop: if a commit ever lands on main
# that did not come from a pull request, it still gets checked.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Without this block the job gets the adopted project's default,
    # minimal token scope — no pull-requests:read. "PR references issue"
    # (link 3, hard block) calls `gh pr view --json closingIssuesReferences`
    # and needs that scope; without explicit permissions that step blocks
    # every PR, not incidentally (issue #85 — the same gap as issue #83/PR
    # #84 in this repo's own CI, fixed here in the template too).
    # contents:read is also explicit here: as soon as one permission is
    # named, the implicit default for the rest no longer applies.
    #
    # issues:read is a separate gap, discovered after pull-requests:read
    # (issue #106, following the same bug on PR #105 for this repo's own
    # workflow, issue #99): closingIssuesReferences is about the linked
    # issue itself, not about the PR. Without issues:read the query
    # silently returns an empty list, even when the link genuinely exists.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone — gitleaks (#264)
          # scans commit history, and a shallow clone would only ever see
          # the tip.
          fetch-depth: 0
      # #248: npm-specific setup is conditional, not assumed — a project
      # on a different stack (no package.json) skips straight to `check`,
      # which is responsible for knowing its own stack's tooling either
      # way (check-convention). Scaffolded here at all only once the
      # project has an executable `check` — see adopt.sh's #248 AC1 gate.
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: hashFiles('package.json') != ''
      - run: ./check
      - name: Secret scan (gitleaks)
        # Backstop for hooks/pre-push's own gitleaks scan (#264) — that
        # hook is bypassable with --no-verify, this step isn't. Full
        # history, not just this push's range: cheap enough to always run
        # in full, and a safe superset catches anything a bypassed
        # pre-push missed at any point in the past, not only in this
        # PR/push.
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner
      - name: PR references issue (link 3)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./check-pr-issue-link.sh "${{ github.event.pull_request.number }}"
      - name: Commit on main comes from a PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./check-main-via-pr.sh "${{ github.sha }}"
