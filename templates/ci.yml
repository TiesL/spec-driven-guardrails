name: CI

# Draait op pull requests én op pushes naar main.
#
# `pull_request` beoordeelt het samengevoegde resultaat — head gemerged in base —
# en niet alleen de branch op zichzelf. Dat is precies het geval dat twee los
# groene branches samen kan breken. Het is bovendien de vorm die je als vereiste
# controle op een pull request kunt instellen, dus de vorm die een merge
# daadwerkelijk kan tegenhouden.
#
# `push: branches: [main]` is de achtervang: komt er ooit een commit op main die
# niet uit een pull request komt, dan wordt die alsnog gecontroleerd.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Zonder dit blok krijgt de job het default, minimale tokenscope van het
    # geadopteerde project — geen pull-requests:read. "PR verwijst naar issue"
    # (schakel 3, hard slot) roept `gh pr view --json closingIssuesReferences`
    # aan en heeft die scope nodig; zonder expliciete permissions blokkeert die
    # stap elke PR, niet incidenteel (issue #85 — hetzelfde gat als issue
    # #83/PR #84 in dit repo's eigen CI, hier meegefixt in het sjabloon).
    # contents:read staat hier ook expliciet: zodra één permission genoemd
    # wordt, vervalt de impliciete default voor de rest.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: PR verwijst naar issue (schakel 3)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./check-pr-issue-link.sh "${{ github.event.pull_request.number }}"
      - name: Commit op main komt uit een PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./check-main-via-pr.sh "${{ github.sha }}"
