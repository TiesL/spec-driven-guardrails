# CI for claude-workflow itself.
#
# Calls ./check instead of inventing separate checks — the same convention
# this repo prescribes for adopted projects, applied to itself. One
# exception: the main-via-PR check (W27, F17) needs network access and
# therefore does not belong in the local, offline ./check — the same
# reason check-pr-issue-link.sh is also a separate CI step for other
# projects instead of part of their check.
#
# This is deliberately not templates/ci.yml: that template assumes npm, and
# this repo has no package.json (see the explanation in ./check). Exactly
# the "other stack" case that WORKFLOW.md describes.
name: CI

# Runs on pull requests and on pushes to main, for the same reason as the
# template: `pull_request` judges the merged result and is the form that
# can be set as a required check on a pull request, and the push trigger
# catches whatever reaches main by another route.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Without this block the job gets this repo's default, minimal token
    # scope — no pull-requests:read. The main-via-PR check (W27, F17) calls
    # `gh api .../commits/$sha/pulls` and needs that scope; without explicit
    # permissions that step always fails, not incidentally (issue #83 —
    # discovered when the first real push-to-main run after PR #80 tripped
    # on this, and `gh run rerun` did not resolve it). contents:read is also
    # explicit here: as soon as one permission is named, the implicit
    # default for the rest no longer applies.
    permissions:
      contents: read
      pull-requests: read
      # closingIssuesReferences (what check-pr-issue-link.sh reads) is a
      # field about the linked issue itself, not about the PR — without
      # issues:read the GraphQL query returns an empty list, even when the
      # link genuinely exists (discovered on PR #105: gh pr view did return
      # "99" locally, with a fully authorized token, but the same call
      # failed in CI under the GITHUB_TOKEN, which at the time was not yet
      # extended). pull-requests:read alone therefore turned out not to be
      # enough for link 3, contrary to what issue #85/#91 assumed.
      issues: read
    steps:
      - uses: actions/checkout@v4
      - run: ./check
      - name: PR references issue (link 3)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./templates/check-pr-issue-link.sh "${{ github.event.pull_request.number }}"
      - name: Commit on main comes from a PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./templates/check-main-via-pr.sh "${{ github.sha }}"
