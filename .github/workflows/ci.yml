# CI for claude-workflow itself.
#
# Calls ./check instead of inventing separate checks — the same convention
# this repo prescribes for adopted projects, applied to itself. One
# exception: the main-via-PR check (W27, F17) needs network access and
# therefore does not belong in the local, offline ./check — the same
# reason check-pr-issue-link.sh is also a separate CI step for other
# projects instead of part of their check.
#
# This is deliberately not templates/ci.yml: that template assumes npm, and
# this repo has no package.json (see the explanation in ./check). Exactly
# the "other stack" case that WORKFLOW.md describes.
name: CI

# Runs on pull requests and on pushes to main, for the same reason as the
# template: `pull_request` judges the merged result and is the form that
# can be set as a required check on a pull request, and the push trigger
# catches whatever reaches main by another route.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Without this block the job gets this repo's default, minimal token
    # scope — no pull-requests:read. The main-via-PR check (W27, F17) calls
    # `gh api .../commits/$sha/pulls` and needs that scope; without explicit
    # permissions that step always fails, not incidentally (issue #83 —
    # discovered when the first real push-to-main run after PR #80 tripped
    # on this, and `gh run rerun` did not resolve it). contents:read is also
    # explicit here: as soon as one permission is named, the implicit
    # default for the rest no longer applies.
    permissions:
      contents: read
      pull-requests: read
      # closingIssuesReferences (what check-pr-issue-link.sh reads) is a
      # field about the linked issue itself, not about the PR — without
      # issues:read the GraphQL query returns an empty list, even when the
      # link genuinely exists (discovered on PR #105: gh pr view did return
      # "99" locally, with a fully authorized token, but the same call
      # failed in CI under the GITHUB_TOKEN, which at the time was not yet
      # extended). pull-requests:read alone therefore turned out not to be
      # enough for link 3, contrary to what issue #85/#91 assumed.
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone — gitleaks (#264)
          # scans commit history, and a shallow clone would only ever see
          # the tip.
          fetch-depth: 0
      - run: ./check
      - name: Secret scan (gitleaks)
        # Backstop for hooks/pre-push's own gitleaks scan (#264) — that
        # hook is bypassable with --no-verify, this step isn't. Full
        # history, not just this push's range: cheap enough to always run
        # in full (this repo's own history scans in under a second), and
        # a safe superset catches anything a bypassed pre-push missed at
        # any point in the past, not only in this PR/push.
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner
      - name: PR references issue (link 3)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./templates/check-pr-issue-link.sh "${{ github.event.pull_request.number }}"
      - name: Commit on main comes from a PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./templates/check-main-via-pr.sh "${{ github.sha }}"

  # The full suite on the macOS platform tools (#422, slice V1 of #411,
  # A35a). The Linux job above runs GNU/mawk-flavoured tools; the defects of
  # #397 only showed on BWK awk, BSD grep and bash 3.2, and CI never ran
  # there. This job puts /usr/bin first so those tools win, installs mawk
  # only for S153, and refuses to run the suite unless the tool identity and
  # the UTF-8 locale are what the leg is named for. Never continue-on-error:
  # a failure here must turn the job red.
  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      # Named, not inherited: the runner must have it, else the identity
      # step fails (never skips).
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Platform tools first on PATH
        run: |
          # GITHUB_PATH prepends, so the last line written ends up first.
          echo "/bin" >> "$GITHUB_PATH"
          echo "/usr/bin" >> "$GITHUB_PATH"
      - name: Install mawk (S153 only)
        # mawk only: no gawk, GNU grep or coreutils, so the suite still runs
        # on the platform tools. S153 fails loudly without it.
        run: brew install mawk
      - name: Tool identity (BWK awk, BSD grep, bash 3.2, UTF-8 locale)
        run: |
          # Reads the banners through PATH, i.e. the tools the suite will
          # resolve. Prints each identity to the job log; exits 1 naming
          # the first mismatched tool.
          awk_id="$(awk --version 2>&1)" || awk_id="awk --version failed"
          grep_id="$(grep --version 2>&1)" || grep_id="grep --version failed"
          bash_id="$(bash --version 2>&1)" || bash_id="bash --version failed"
          locale_id="$(locale 2>&1)" || locale_id="locale failed"
          locales="$(locale -a 2>&1)" || locales=""
          echo "awk:    $(printf '%s\n' "$awk_id" | sed -n 1p)"
          echo "grep:   $(printf '%s\n' "$grep_id" | sed -n 1p)"
          echo "bash:   $(printf '%s\n' "$bash_id" | sed -n 1p) (running: $BASH_VERSION)"
          echo "locale: $(printf '%s\n' "$locale_id" | tr '\n' ' ')"
          case "$awk_id" in
            "awk version "*) ;;
            *) echo "FAIL: awk is not BWK awk (expected 'awk version <date>')"; exit 1 ;;
          esac
          case "$grep_id" in
            *"BSD grep"*) ;;
            *) echo "FAIL: grep is not BSD grep"; exit 1 ;;
          esac
          case "$bash_id" in
            *"version 3.2."*) ;;
            *) echo "FAIL: bash on PATH is not bash 3.2"; exit 1 ;;
          esac
          case "$BASH_VERSION" in
            3.2.*) ;;
            *) echo "FAIL: the running bash is not bash 3.2 ($BASH_VERSION)"; exit 1 ;;
          esac
          case "$locale_id" in
            *UTF-8*) ;;
            *) echo "FAIL: the UTF-8 locale is not in effect (locale reports no UTF-8)"; exit 1 ;;
          esac
          case "$locales" in
            *en_US.UTF-8*) ;;
            *) echo "FAIL: the en_US.UTF-8 locale is not installed on this runner"; exit 1 ;;
          esac
      - name: Full test suite (bash 3.2)
        run: /bin/bash test/run.sh
