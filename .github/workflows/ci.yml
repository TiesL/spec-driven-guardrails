# CI voor claude-workflow zelf.
#
# Roept ./check aan zonder losse checks te verzinnen — dezelfde conventie die
# dit repo aan geadopteerde projecten voorschrijft, hier op zichzelf
# toegepast. Eén uitzondering: de main-via-PR-controle (W27, F17) heeft
# netwerk nodig en hoort dus niet in het lokale, offline ./check — zelfde
# reden waarom check-pr-issue-link.sh voor andere projecten ook een losse
# CI-stap is in plaats van onderdeel van hun check.
#
# Dit is bewust niet templates/ci.yml: dat sjabloon veronderstelt npm, en dit
# repo heeft geen package.json (zie de toelichting in ./check). Precies het
# "andere stack"-geval dat WORKFLOW.md beschrijft.
name: CI

# Draait op pull requests én op pushes naar main, om dezelfde reden als het
# sjabloon: `pull_request` beoordeelt het samengevoegde resultaat en is de vorm
# die als vereiste controle op een pull request ingesteld kan worden, en de
# push-trigger vangt op wat main langs een andere weg bereikt.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./check
      - name: Commit op main komt uit een PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./templates/check-main-via-pr.sh "${{ github.sha }}"
